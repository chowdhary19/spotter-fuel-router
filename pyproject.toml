[project]
name = "spotter-fuel-router"
version = "0.1.0"
description = "A Django API for road routes and cost-aware fuel purchases."
requires-python = ">=3.13,<3.16"
dependencies = [
  "Django==6.1.3",
  "requests>=2.32.5,<3",
  "shapely>=2.1,<3",
  "pyproj>=3.7,<4",
  "gunicorn>=23,<27",
  "whitenoise>=6.9,<7",
]

[dependency-groups]
dev = ["pytest>=8.4,<10", "pytest-django>=4.11,<5", "ruff>=0.14,<1"]
data = ["pyjson5==2.0.1"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
